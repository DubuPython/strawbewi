<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday! 🍓🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-bg: #fff0f5;
            --pink-accent: #ff69b4;
            --strawberry-red: #e11d48;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--pink-bg);
            background-image: 
                radial-gradient(#fbcfe8 1.5px, transparent 1.5px),
                radial-gradient(#fbcfe8 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            overflow: hidden; /* Prevent scrolling */
            margin: 0;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
        }

        .cursive {
            font-family: 'Caveat', cursive;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
            z-index: 10;
        }

        .view.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .view.inactive-up {
            transform: translateY(-50px) scale(0.95);
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .envelope-wrapper:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #fce7f3;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 15px 35px rgba(225, 29, 72, 0.2);
            border: 2px solid #fbcfe8;
            max-width: 90vw;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #f9a8d4;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid #fbcfe8;
            border-right: 140px solid #fbcfe8;
            border-bottom: 100px solid #f472b6;
            z-index: 3;
            border-radius: 0 0 6px 6px;
        }

        .heart-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            z-index: 5;
            transition: opacity 0.3s ease, transform 0.3s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .envelope.open .heart-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
        }

        @keyframes flash {
            0%, 100% { opacity: 1; color: var(--strawberry-red); transform: scale(1); }
            50% { opacity: 0.7; color: var(--pink-accent); transform: scale(1.05); }
        }

        .flashing-text {
            animation: flash 1.5s infinite ease-in-out;
        }

        #btn-no {
            /* Smooth transitions for the evasion effect */
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                        background-color 0.2s ease;
            z-index: 50;
        }

        .floating-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-item {
            position: absolute;
            bottom: -60px;
            animation: floatUp linear infinite;
            opacity: 0.9;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .card-inner {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(225, 29, 72, 0.25);
            border: 3px dashed #fbcfe8;
            z-index: 20;
        }
        
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="view1" class="view active">
        <div class="text-center mb-8 md:mb-10">
            <h2 class="cursive text-4xl md:text-5xl text-pink-600 mb-3 drop-shadow-sm px-4">You've got mail! 💌</h2>
            <p class="text-pink-500 font-semibold text-base md:text-lg animate-pulse">Tap to open me</p>
        </div>
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <div class="envelope" id="envelope">
                <div class="flap"></div>
                <div class="envelope-front"></div>
                <div class="heart-seal">🍓</div>
            </div>
        </div>
    </div>

    <div id="view2" class="view">
        <div class="bg-white/90 p-6 md:p-12 rounded-3xl shadow-2xl border-4 border-pink-200 text-center max-w-sm w-[90%] relative">
            <div class="absolute -top-5 -left-5 text-4xl drop-shadow-md hover:animate-spin">🌸</div>
            <div class="absolute -bottom-5 -right-5 text-4xl drop-shadow-md hover:animate-bounce">🍓</div>
            
            <h1 class="cursive text-4xl md:text-6xl font-bold flashing-text mb-6 md:mb-8 mt-2">Ready kana ba?</h1>
            
            <!-- Buttons are rendered side-by-side initially -->
            <div id="button-container" class="flex flex-row justify-center items-center gap-4 md:gap-6 mt-6 md:mt-8 h-16">
                <button id="btn-yes" onclick="showFinalCard()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 md:px-8 rounded-full shadow-lg transform hover:scale-110 transition-all text-lg md:text-xl z-20">
                    Yes! 💖
                </button>
                
                <button id="btn-no" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-3 px-6 md:px-8 rounded-full shadow text-lg md:text-xl relative touch-none">
                    No
                </button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    
    <div id="view3" class="view">
        <div id="floating-container" class="floating-container"></div>
        
        <div class="card-inner p-4 md:p-8 rounded-2xl max-w-3xl w-[95%] text-center relative mt-2 flex flex-col items-center">
            
            <!-- Landscape Picture Frame Container -->
            <div class="relative p-3 md:p-5 bg-white shadow-2xl rounded-xl border-4 border-pink-100 mb-4 md:mb-6 w-full mx-auto transform -rotate-1 hover:rotate-0 transition-transform duration-500">
                
                <!-- Frame Decorations -->
                <div class="absolute -top-4 -left-4 md:-top-6 md:-left-6 text-3xl md:text-5xl z-10 drop-shadow-md animate-pulse">🌸</div>
                <div class="absolute -top-3 -right-3 md:-top-5 md:-right-5 text-3xl md:text-4xl z-10 drop-shadow-md">🍓</div>
                <div class="absolute -bottom-4 -right-4 md:-bottom-6 md:-right-6 text-3xl md:text-5xl z-10 drop-shadow-md animate-pulse">🌸</div>
                <div class="absolute -bottom-3 -left-3 md:-bottom-5 md:-left-5 text-3xl md:text-4xl z-10 drop-shadow-md">🍓</div>
                
                <!-- Inner Matting and Landscape Image (16:9 Aspect Ratio) -->
                <div class="border-2 border-dashed border-pink-300 p-2 rounded-lg bg-pink-50 w-full">
                    <!-- USER IMAGE HERE: Replace the src attribute with your own landscape image file/URL -->
                    <img src="happy bidet.jpg" 
                         alt="Birthday Frame" 
                         onerror="this.src='https://placehold.co/1280x720/fbcfe8/e11d48?text=Your+Landscape+Picture'"
                         class="w-full h-auto aspect-video object-cover rounded shadow-inner">
                </div>
                
                <!-- Frame Caption -->
                <div class="mt-3 md:mt-4 cursive text-2xl md:text-4xl text-rose-500 font-bold">Happy Birthday! 💖</div>
            </div>
            
            <!-- Short message below the frame -->
            <div class="text-gray-800 text-base md:text-xl font-semibold mt-1">
                <p>Wishing you the sweetest day! 🍓✨</p>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const view1 = document.getElementById('view1');
        const view2 = document.getElementById('view2');
        const view3 = document.getElementById('view3');
        const envelope = document.getElementById('envelope');
        const btnNo = document.getElementById('btn-no');
        
        // Evasion logic variables
        const noPhrases = [
            "Bawal tumanggi!",
            "Try again!",
            "Nope!",
            "Di pwede",
            "Yes lang pwede",
            "Ayaw mo ba?",
            "Bleehh 😝",
            "Click Yes na!",
            "Makulit ah!",
            "No is not an option!"
        ];
        let phraseIndex = 0;
        let isButtonFixed = false;

        // View 1 to View 2
        function openEnvelope() {
            envelope.classList.add('open');
            setTimeout(() => {
                view1.classList.remove('active');
                view1.classList.add('inactive-up');
                
                view2.classList.add('active');
            }, 800);
        }

        function evadeButton(e) {
            if(e) e.preventDefault(); // Prevent clicks/touch scrolls
            
            // On first hover/touch, pop it out of the flex container into fixed positioning
            if (!isButtonFixed) {
                // Get current position so it doesn't jump wildly on the very first frame
                const rect = btnNo.getBoundingClientRect();
                btnNo.style.position = 'fixed';
                btnNo.style.left = `${rect.left}px`;
                btnNo.style.top = `${rect.top}px`;
                btnNo.style.margin = '0'; // Remove any flexbox margins
                isButtonFixed = true;
                
                // Allow a tiny delay before moving to avoid a layout glitch
                setTimeout(() => moveToRandomPosition(), 50);
            } else {
                moveToRandomPosition();
            }
        }

        function moveToRandomPosition() {
            // Update text
            btnNo.innerText = noPhrases[phraseIndex];
            phraseIndex = (phraseIndex + 1) % noPhrases.length;
            
            // Adjust visual style for fun
            btnNo.classList.remove('bg-gray-300', 'text-gray-700');
            btnNo.classList.add('bg-rose-200', 'text-rose-800', 'border-2', 'border-rose-400');
            
            // Calculate boundaries safely for mobile and desktop
            const btnRect = btnNo.getBoundingClientRect();
            // Ensure padding prevents button from being stuck off-screen or behind notches
            const paddingX = 20; 
            const paddingY = 40; // Extra padding Y for mobile browsers
            
            // Safe boundaries
            const maxX = Math.max(0, window.innerWidth - btnRect.width - paddingX);
            const maxY = Math.max(0, window.innerHeight - btnRect.height - paddingY);
            
            // Generate random coordinates within safe bounds
            const randomX = Math.max(paddingX, Math.random() * maxX);
            const randomY = Math.max(paddingY, Math.random() * maxY);
            
            // Apply new position
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        // Attach event listeners for the evasion (desktop and mobile)
        btnNo.addEventListener('mouseover', evadeButton);
        btnNo.addEventListener('touchstart', evadeButton, {passive: false});
        btnNo.addEventListener('click', evadeButton);

        function showFinalCard() {
            view2.classList.remove('active');
            view2.classList.add('inactive-up');
            
            // Hide the No button permanently 
            btnNo.style.display = 'none';
            
            // Show final view
            setTimeout(() => {
                view3.classList.add('active');
                startDecorations();
            }, 300);
        }

        function startDecorations() {
            createFloatingElements();
            initConfetti();
        }

        function createFloatingElements() {
            const container = document.getElementById('floating-container');
            const emojis = ['🍓', '🌸', '💖', '🌺', '✨'];
            // Responsive number of elements
            const numberOfElements = window.innerWidth < 768 ? 15 : 35; 
            
            for (let i = 0; i < numberOfElements; i++) {
                setTimeout(() => {
                    spawnSingleFloatingElement(container, emojis);
                }, Math.random() * 4000); // Stagger spawns
            }
        }
        
        function spawnSingleFloatingElement(container, emojis) {
            const el = document.createElement('div');
            el.className = 'floating-item text-3xl md:text-5xl drop-shadow-md';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Randomize starting X and float duration
            el.style.left = `${Math.random() * 100}vw`;
            el.style.animationDuration = `${6 + Math.random() * 8}s`;
            
            container.appendChild(el);
            
            // Remove when animation finishes, then spawn a new one to keep it endless
            el.addEventListener('animationend', () => {
                el.remove();
                spawnSingleFloatingElement(container, emojis);
            });
        }

        function initConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            
            // Resize handler
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const confetti = [];
            const colors = ['#ff87ab', '#fbb1bd', '#f9a8d4', '#e11d48', '#fda4af', '#ffffff'];

            // Initial confetti burst - scale by screen size
            const burstCount = window.innerWidth < 768 ? 80 : 150;
            for (let i = 0; i < burstCount; i++) {
                confetti.push(createConfettiParticle(canvas, colors));
            }

            function createConfettiParticle(cvs, colorArray) {
                return {
                    x: Math.random() * cvs.width,
                    y: Math.random() * cvs.height - cvs.height, // Start above screen
                    size: Math.random() * 10 + 5,
                    color: colorArray[Math.floor(Math.random() * colorArray.length)],
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    angle: Math.random() * 360,
                    spin: Math.random() * 0.2 - 0.1
                };
            }

            function animateConfetti() {
                requestAnimationFrame(animateConfetti);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                confetti.forEach((c) => {
                    c.y += c.speedY;
                    c.x += c.speedX;
                    c.angle += c.spin;
                    
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.angle);
                    ctx.fillStyle = c.color;
                    
                    // Draw a mix of circles and rectangles
                    if (c.size % 2 > 1) {
                        ctx.beginPath();
                        ctx.arc(0, 0, c.size/2, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size * 0.6);
                    }
                    
                    ctx.restore();

                    // Reset particle when it falls off screen
                    if (c.y > canvas.height) {
                        c.y = -20;
                        c.x = Math.random() * canvas.width;
                        c.speedY = Math.random() * 3 + 2;
                    }
                });
            }

            animateConfetti();
        }
    </script>
</body>
</html>
